server.port=8085

# Spring DataSource MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quizmaster_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Static web resources
spring.web.resources.static-locations=classpath:/static/

# App Custom Properties
quizmaster.app.jwtSecret=QuizMasterSecretKeyForJwtAuthenticationTokenGeneration2026BTechFinalYearProjectLongSecretKeyMustBeOver256Bits
quizmaster.app.jwtExpirationMs=86400000
quizmaster.ai.serviceUrl=http://127.0.0.1:5001/api/recommend

# File Upload Settings (for profile picture)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
