<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5 shadow-sm border-0">
          <div class="text-center mb-4">
            <div class="stat-icon-wrapper bg-success-subtle text-success rounded-circle mx-auto mb-3">
              <i class="bi bi-shield-check fs-3"></i>
            </div>
            <h3 class="fw-bold">Set New Password</h3>
            <p class="text-muted small">Enter the reset code provided and choose your new password.</p>
          </div>

          <div id="alert-box" class="alert alert-danger d-none py-2 small" role="alert"></div>

          <form id="reset-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Reset Authorization Code *</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-key-fill"></i></span>
                <input type="text" id="reset-token" class="form-control text-uppercase" placeholder="e.g. 8-digit code" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">New Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary-custom w-100 py-2 mt-2">
              <i class="bi bi-check-lg me-1"></i> Update Password
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            <a href="login.html" class="fw-semibold text-primary text-decoration-none">&larr; Back to Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('reset-token').value.trim();
      const newPassword = document.getElementById('new-password').value;
      const alertBox = document.getElementById('alert-box');
      alertBox.classList.add('d-none');

      try {
        const res = await Api.post('/auth/reset-password', { token, newPassword });
        if (res && res.success) {
          Swal.fire({
            icon: 'success',
            title: 'Password Reset Successful!',
            text: res.message,
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'login.html';
          });
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Error updating password. Token may be invalid or expired.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
