<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Quizzes – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">Quiz Management</h3>
          <p class="text-secondary small mb-0">Create, configure, and monitor quizzes across all subject areas.</p>
        </div>
        <button class="btn btn-primary-custom btn-sm" onclick="openQuizModal()">
          <i class="bi bi-plus-lg me-1"></i> Create Quiz
        </button>
      </div>

      <div class="card card-custom p-4 bg-white">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>Quiz Title</th>
                <th>Category</th>
                <th>Difficulty</th>
                <th>Questions</th>
                <th>Time Limit</th>
                <th>Marks</th>
                <th style="width: 200px;">Actions</th>
              </tr>
            </thead>
            <tbody id="quizzes-tbody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted small">Loading quizzes...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Quiz Modal -->
  <div class="modal fade" id="quizModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="quiz-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="quizModalTitle">Create Quiz</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="quiz-id">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label small fw-semibold">Quiz Title *</label>
                <input type="text" id="quiz-title-input" class="form-control" placeholder="e.g. Advanced Operating Systems" required>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Category *</label>
                <select id="quiz-category-select" class="form-select" required></select>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Difficulty Level *</label>
                <select id="quiz-diff-select" class="form-select">
                  <option value="BEGINNER">Beginner</option>
                  <option value="INTERMEDIATE" selected>Intermediate</option>
                  <option value="ADVANCED">Advanced</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Time Limit (Minutes) *</label>
                <input type="number" id="quiz-time-input" class="form-control" value="15" min="1" max="180" required>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Passing Score (%) *</label>
                <input type="number" id="quiz-pass-input" class="form-control" value="60" min="1" max="100" required>
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Description</label>
                <textarea id="quiz-desc-input" class="form-control" rows="3" placeholder="Syllabus covered in this quiz..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom btn-sm">Save Quiz</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAdmin();

    let quizModal = null;
    let categoriesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      quizModal = new bootstrap.Modal(document.getElementById('quizModal'));
      await loadCategories();
      await loadQuizzes();
    });

    async function loadCategories() {
      try {
        categoriesList = await Api.get('/categories');
        const sel = document.getElementById('quiz-category-select');
        sel.innerHTML = categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (err) {
        console.error('Failed to load categories for select:', err);
      }
    }

    async function loadQuizzes() {
      try {
        const quizzes = await Api.get('/admin/quizzes');
        const tbody = document.getElementById('quizzes-tbody');
        if (!quizzes || quizzes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted small">No quizzes created yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = quizzes.map(q => `
          <tr>
            <td>
              <div class="fw-bold text-dark">${q.title}</div>
              <div class="small text-muted text-truncate" style="max-width: 250px;">${q.description || ''}</div>
            </td>
            <td><span class="badge bg-light text-dark border">${q.categoryName}</span></td>
            <td><span class="badge bg-secondary">${q.difficulty}</span></td>
            <td><span class="fw-bold">${q.questionCount || 0}</span></td>
            <td>${q.timeLimitMinutes}m</td>
            <td>${q.totalMarks} pts</td>
            <td>
              <div class="d-flex gap-1">
                <a href="admin-questions.html?quizId=${q.id}" class="btn btn-sm btn-light border py-1 px-2 text-success" title="Manage Questions">
                  <i class="bi bi-patch-question-fill"></i> Questions
                </a>
                <button class="btn btn-sm btn-light border py-1 px-2 text-primary" onclick='editQuiz(${JSON.stringify(q)})' title="Edit Quiz">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-light border py-1 px-2 text-danger" onclick="deleteQuiz(${q.id})" title="Delete Quiz">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('quizzes-tbody').innerHTML = `
          <tr><td colspan="7" class="text-center text-danger py-4">Failed to load quizzes.</td></tr>
        `;
      }
    }

    function openQuizModal() {
      document.getElementById('quiz-id').value = '';
      document.getElementById('quiz-form').reset();
      document.getElementById('quizModalTitle').textContent = 'Create Quiz';
      quizModal.show();
    }

    function editQuiz(q) {
      document.getElementById('quiz-id').value = q.id;
      document.getElementById('quiz-title-input').value = q.title;
      document.getElementById('quiz-category-select').value = q.categoryId;
      document.getElementById('quiz-diff-select').value = q.difficulty;
      document.getElementById('quiz-time-input').value = q.timeLimitMinutes;
      document.getElementById('quiz-pass-input').value = q.passPercentage;
      document.getElementById('quiz-desc-input').value = q.description || '';
      document.getElementById('quizModalTitle').textContent = 'Edit Quiz';
      quizModal.show();
    }

    document.getElementById('quiz-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('quiz-id').value;
      const title = document.getElementById('quiz-title-input').value.trim();
      const categoryId = parseInt(document.getElementById('quiz-category-select').value);
      const difficulty = document.getElementById('quiz-diff-select').value;
      const timeLimitMinutes = parseInt(document.getElementById('quiz-time-input').value);
      const passPercentage = parseInt(document.getElementById('quiz-pass-input').value);
      const description = document.getElementById('quiz-desc-input').value.trim();

      const payload = { title, categoryId, difficulty, timeLimitMinutes, passPercentage, description };

      try {
        if (id) {
          await Api.put(`/admin/quizzes/${id}`, payload);
          showToast('Quiz updated successfully!', 'success');
        } else {
          await Api.post('/admin/quizzes', payload);
          showToast('Quiz created successfully!', 'success');
        }
        quizModal.hide();
        await loadQuizzes();
      } catch (err) {
        Swal.fire('Error', err.message || 'Failed to save quiz.', 'error');
      }
    });

    async function deleteQuiz(id) {
      const res = await Swal.fire({
        title: 'Delete Quiz?',
        text: 'This will delete the quiz and all associated questions!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Yes, delete'
      });

      if (res.isConfirmed) {
        try {
          await Api.del(`/admin/quizzes/${id}`);
          showToast('Quiz deleted successfully!', 'success');
          await loadQuizzes();
        } catch (err) {
          Swal.fire('Error', err.message || 'Failed to delete quiz.', 'error');
        }
      }
    }
  </script>
</body>
</html>
