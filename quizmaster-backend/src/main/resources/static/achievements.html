<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements & Badges – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1 d-flex align-items-center gap-2">
            <i class="bi bi-award-fill text-warning"></i> Gamification & Badges
          </h3>
          <p class="text-secondary small mb-0">Unlock achievements as you take quizzes, maintain streaks, and achieve high accuracy.</p>
        </div>
        <div id="achievements-unlocked-pill">
          <span class="badge bg-primary-subtle text-primary p-2 fs-7 fw-semibold border border-primary border-opacity-25" id="unlocked-counter">
            0 / 8 Unlocked
          </span>
        </div>
      </div>

      <div class="row g-4" id="achievements-grid">
        <div class="col-12 text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
          <div>Loading achievements...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const list = await Api.get('/achievements/my');
        renderAchievements(list);
      } catch (err) {
        document.getElementById('achievements-grid').innerHTML = `
          <div class="col-12 text-center text-danger py-4">Failed to load achievements.</div>
        `;
      }
    });

    function renderAchievements(list) {
      const grid = document.getElementById('achievements-grid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No achievements configured yet.</div>';
        return;
      }

      const unlockedCount = list.filter(a => a.isUnlocked).length;
      document.getElementById('unlocked-counter').textContent = `${unlockedCount} / ${list.length} Badges Unlocked`;

      grid.innerHTML = list.map(a => {
        const isUnlocked = a.isUnlocked;
        const color = a.badgeColor || '#4f46e5';

        return `
          <div class="col-sm-6 col-md-4 col-xl-3">
            <div class="achievement-card card card-custom h-100 ${isUnlocked ? '' : 'locked'}">
              <div class="badge-icon-lg" style="background: ${color};">
                <i class="bi ${a.icon || 'bi-trophy'}"></i>
              </div>
              <h5 class="fw-bold text-dark mb-1">${a.title}</h5>
              <p class="text-secondary small mb-3">${a.description}</p>
              
              <div class="mt-auto">
                ${isUnlocked 
                  ? `<span class="badge bg-success-subtle text-success border border-success border-opacity-25 w-100 py-1">
                      <i class="bi bi-check-circle-fill me-1"></i> Unlocked
                     </span>`
                  : `<span class="badge bg-light text-muted border w-100 py-1">
                      <i class="bi bi-lock-fill me-1"></i> Locked
                     </span>`
                }
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
