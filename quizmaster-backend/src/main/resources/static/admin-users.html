<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">User Management</h3>
          <p class="text-secondary small mb-0">View registered candidates, promote administrator privileges, and toggle account states.</p>
        </div>
        <div class="input-group" style="max-width: 300px;">
          <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="user-search" class="form-control" placeholder="Search by name or email..." onkeyup="filterUsers()">
        </div>
      </div>

      <div class="card card-custom p-4 bg-white">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>User Details</th>
                <th>Education</th>
                <th>Skills &amp; Interests</th>
                <th>Role</th>
                <th>Status</th>
                <th style="width: 180px;">Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted small">Loading users...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAdmin();

    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadUsers();
    });

    async function loadUsers() {
      try {
        allUsers = await Api.get('/admin/users');
        renderUsers(allUsers);
      } catch (err) {
        document.getElementById('users-tbody').innerHTML = `
          <tr><td colspan="6" class="text-center text-danger py-4">Failed to load users.</td></tr>
        `;
      }
    }

    function renderUsers(list) {
      const tbody = document.getElementById('users-tbody');
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted small">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(u => {
        const isAdmin = u.roles && u.roles.includes('ROLE_ADMIN');
        const isEnabled = u.enabled !== false;
        const avatar = u.avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.fullName || 'User')}&background=random`;

        return `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${avatar}" alt="${u.fullName}" class="rounded-circle" width="36" height="36" style="object-fit: cover;">
                <div>
                  <div class="fw-bold text-dark">${u.fullName}</div>
                  <div class="small text-muted">${u.email}</div>
                </div>
              </div>
            </td>
            <td class="small">${u.education || '<span class="text-muted">N/A</span>'}</td>
            <td class="small" style="max-width: 200px;">
              <div class="text-truncate" title="${u.skills || ''}"><strong>Skills:</strong> ${u.skills || 'N/A'}</div>
              <div class="text-truncate" title="${u.interests || ''}"><strong>Interests:</strong> ${u.interests || 'N/A'}</div>
            </td>
            <td>
              ${isAdmin ? '<span class="badge bg-primary text-white">Administrator</span>' : '<span class="badge bg-secondary-subtle text-secondary">Learner</span>'}
            </td>
            <td>
              ${isEnabled ? '<span class="badge bg-success-subtle text-success">Active</span>' : '<span class="badge bg-danger-subtle text-danger">Suspended</span>'}
            </td>
            <td>
              <div class="d-flex gap-1">
                <button class="btn btn-sm btn-outline-secondary py-1 px-2" onclick="toggleAdminRole(${u.id})" title="Toggle Admin Role">
                  <i class="bi bi-shield"></i> ${isAdmin ? 'Demote' : 'Promote'}
                </button>
                <button class="btn btn-sm ${isEnabled ? 'btn-outline-danger' : 'btn-outline-success'} py-1 px-2" onclick="toggleUserStatus(${u.id})" title="Toggle Active Status">
                  <i class="bi ${isEnabled ? 'bi-lock' : 'bi-unlock'}"></i> ${isEnabled ? 'Suspend' : 'Activate'}
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const q = document.getElementById('user-search').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.fullName && u.fullName.toLowerCase().includes(q)) ||
        (u.email && u.email.toLowerCase().includes(q))
      );
      renderUsers(filtered);
    }

    async function toggleAdminRole(id) {
      try {
        await Api.put(`/admin/users/${id}/toggle-admin`, {});
        showToast('User role updated!', 'success');
        await loadUsers();
      } catch (err) {
        Swal.fire('Error', err.message || 'Failed to update role.', 'error');
      }
    }

    async function toggleUserStatus(id) {
      try {
        await Api.put(`/admin/users/${id}/toggle-status`, {});
        showToast('User status updated!', 'success');
        await loadUsers();
      } catch (err) {
        Swal.fire('Error', err.message || 'Failed to toggle status.', 'error');
      }
    }
  </script>
</body>
</html>
