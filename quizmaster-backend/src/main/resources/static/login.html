<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5 shadow-sm border-0">
          <div class="text-center mb-4">
            <div class="stat-icon-wrapper bg-primary-subtle text-primary rounded-circle mx-auto mb-3">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Log in to resume quizzes, track streaks, and view AI recommendations</p>
          </div>

          <div id="alert-box" class="alert alert-danger d-none py-2 small" role="alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-semibold">Password</label>
                <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary-custom w-100 py-2 mt-2">
              <span id="btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Log In</span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Don't have an account? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (Auth.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('alert-box');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const submitBtn = document.getElementById('submit-btn');

      alertBox.classList.add('d-none');
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');
      submitBtn.disabled = true;

      try {
        const response = await Api.post('/auth/login', { email, password });
        if (response && response.token) {
          Auth.setAuth(response.token, response);
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'dashboard.html';
            window.location.href = redirect;
          }, 800);
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please check credentials.';
        alertBox.classList.remove('d-none');
      } finally {
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
