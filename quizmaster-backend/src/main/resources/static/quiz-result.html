<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Result – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-custom p-4 p-md-5 bg-white shadow-sm border-0 text-center">
          
          <!-- Result Icon & Performance Badge -->
          <div id="result-icon-container" class="mb-3">
            <div class="stat-icon-wrapper rounded-circle mx-auto bg-success-subtle text-success" style="width: 80px; height: 80px; font-size: 2.5rem;">
              <i class="bi bi-trophy-fill"></i>
            </div>
          </div>

          <h2 class="fw-bold mb-1" id="quiz-title">Quiz Result</h2>
          <p class="text-secondary small mb-3">Category: <span class="fw-semibold text-dark" id="quiz-category">--</span></p>

          <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-4" id="pass-status-pill">
            <span class="fw-bold" id="pass-status-text">PASSED</span>
          </div>

          <!-- Score Big Counter -->
          <div class="p-4 bg-light rounded border mb-4">
            <div class="row g-3 align-items-center">
              <div class="col-md-4 border-end-md">
                <div class="stat-value text-primary fs-1 fw-extrabold" id="score-val">0 / 0</div>
                <div class="text-muted small text-uppercase">Score Obtained</div>
              </div>
              <div class="col-md-4 border-end-md">
                <div class="stat-value text-dark fs-1 fw-extrabold" id="pct-val">0%</div>
                <div class="text-muted small text-uppercase">Percentage</div>
              </div>
              <div class="col-md-4">
                <div class="stat-value text-success fs-1 fw-extrabold" id="acc-val">0%</div>
                <div class="text-muted small text-uppercase">Accuracy</div>
              </div>
            </div>
          </div>

          <!-- Breakdown Stats Grid -->
          <div class="row g-3 text-center mb-4">
            <div class="col-6 col-md-3">
              <div class="p-3 border rounded">
                <div class="fw-bold text-dark fs-5" id="stat-total">0</div>
                <div class="small text-muted">Total Questions</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 border rounded bg-success-subtle">
                <div class="fw-bold text-success fs-5" id="stat-correct">0</div>
                <div class="small text-success">Correct</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 border rounded bg-danger-subtle">
                <div class="fw-bold text-danger fs-5" id="stat-incorrect">0</div>
                <div class="small text-danger">Incorrect</div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="p-3 border rounded">
                <div class="fw-bold text-secondary fs-5" id="stat-time">0s</div>
                <div class="small text-muted">Time Taken</div>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex flex-wrap justify-content-center gap-3 pt-3 border-top">
            <button class="btn btn-primary-custom px-4" onclick="goToReview()">
              <i class="bi bi-card-checklist me-1"></i> Review Explanations
            </button>
            <button class="btn btn-outline-custom px-4" onclick="downloadPdfReport()">
              <i class="bi bi-file-earmark-pdf me-1"></i> Print / PDF Report
            </button>
            <button class="btn btn-light border px-3" onclick="retryQuiz()">
              <i class="bi bi-arrow-clockwise me-1"></i> Retry Quiz
            </button>
            <a href="dashboard.html" class="btn btn-light border px-3">
              <i class="bi bi-house me-1"></i> Dashboard
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    const params = new URLSearchParams(window.location.search);
    const attemptId = params.get('attemptId');
    if (!attemptId) window.location.href = 'dashboard.html';

    let quizData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const result = await Api.get(`/attempts/${attemptId}/result`);
        quizData = result;

        document.getElementById('quiz-title').textContent = result.quizTitle;
        document.getElementById('quiz-category').textContent = result.categoryName;
        document.getElementById('score-val').textContent = `${result.score} / ${result.totalMarks}`;
        document.getElementById('pct-val').textContent = `${result.percentage}%`;
        document.getElementById('acc-val').textContent = `${result.accuracy}%`;

        document.getElementById('stat-total').textContent = result.totalQuestions;
        document.getElementById('stat-correct').textContent = result.correctAnswers;
        document.getElementById('stat-incorrect').textContent = result.incorrectAnswers;
        document.getElementById('stat-time').textContent = `${result.timeTakenSeconds}s`;

        // Pass/Fail Pill
        const pill = document.getElementById('pass-status-pill');
        const text = document.getElementById('pass-status-text');
        if (result.passed) {
          pill.className = 'd-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-4 bg-success-subtle text-success border border-success border-opacity-25';
          text.textContent = `PASSED – ${result.performanceLevel}`;
        } else {
          pill.className = 'd-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill mb-4 bg-danger-subtle text-danger border border-danger border-opacity-25';
          text.textContent = `FAILED – ${result.performanceLevel}`;
        }

      } catch (err) {
        Swal.fire('Error', 'Failed to retrieve assessment score.', 'error').then(() => {
          window.location.href = 'dashboard.html';
        });
      }
    });

    function goToReview() {
      window.location.href = `answer-review.html?attemptId=${attemptId}`;
    }

    function retryQuiz() {
      if (quizData && quizData.quizId) {
        window.location.href = `quiz-instructions.html?id=${quizData.quizId}`;
      } else {
        window.location.href = 'quizzes.html';
      }
    }

    function downloadPdfReport() {
      window.open(`/api/attempts/${attemptId}/report`, '_blank');
    }
  </script>
</body>
</html>
