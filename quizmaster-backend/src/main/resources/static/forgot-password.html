<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5 shadow-sm border-0">
          <div class="text-center mb-4">
            <div class="stat-icon-wrapper bg-warning-subtle text-warning rounded-circle mx-auto mb-3">
              <i class="bi bi-question-circle-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Password Recovery</h3>
            <p class="text-muted small">Enter your account email to receive a password reset authorization code.</p>
          </div>

          <div id="alert-box" class="alert alert-danger d-none py-2 small" role="alert"></div>
          <div id="success-box" class="alert alert-success d-none py-2 small" role="alert"></div>

          <form id="forgot-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Registered Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary-custom w-100 py-2 mt-2">
              <i class="bi bi-send me-1"></i> Send Reset Code
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Remembered your password? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Return to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const alertBox = document.getElementById('alert-box');
      const successBox = document.getElementById('success-box');
      alertBox.classList.add('d-none');
      successBox.classList.add('d-none');

      try {
        const res = await Api.post('/auth/forgot-password', { email });
        successBox.innerHTML = `${res.message} <br><a href="reset-password.html" class="fw-bold alert-link mt-2 d-inline-block">Click here to enter code & reset password &rarr;</a>`;
        successBox.classList.remove('d-none');
      } catch (err) {
        alertBox.textContent = err.message || 'Error processing request.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
