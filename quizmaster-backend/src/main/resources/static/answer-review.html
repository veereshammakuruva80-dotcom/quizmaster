<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Review – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="app-navbar"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold mb-1">Answer & Explanation Review</h3>
            <p class="text-secondary small mb-0">Detailed question-by-question breakdown, correct answers, and conceptual explanations.</p>
          </div>
          <button class="btn btn-outline-secondary btn-sm" onclick="history.back()">
            &larr; Back to Results
          </button>
        </div>

        <div id="reviews-container">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
            <div>Loading answer review...</div>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="dashboard.html" class="btn btn-primary-custom px-4">
            <i class="bi bi-house me-1"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    const params = new URLSearchParams(window.location.search);
    const attemptId = params.get('attemptId');
    if (!attemptId) window.location.href = 'dashboard.html';

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const reviews = await Api.get(`/attempts/${attemptId}/review`);
        renderReviews(reviews);
      } catch (err) {
        document.getElementById('reviews-container').innerHTML = `
          <div class="card card-custom p-4 text-center text-danger">Failed to load answer review.</div>
        `;
      }
    });

    function renderReviews(reviews) {
      const container = document.getElementById('reviews-container');
      if (!reviews || reviews.length === 0) {
        container.innerHTML = '<div class="card card-custom p-4 text-center text-muted">No review records found.</div>';
        return;
      }

      container.innerHTML = reviews.map((q, idx) => {
        const statusBadge = q.isCorrect 
          ? '<span class="badge bg-success-subtle text-success border border-success border-opacity-25"><i class="bi bi-check-circle-fill me-1"></i> Correct (' + q.marksAwarded + '/' + q.maxMarks + ' Marks)</span>'
          : '<span class="badge bg-danger-subtle text-danger border border-danger border-opacity-25"><i class="bi bi-x-circle-fill me-1"></i> Incorrect (0/' + q.maxMarks + ' Marks)</span>';

        return `
          <div class="card card-custom p-4 mb-4 bg-white shadow-xs">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="badge bg-light text-dark border">Question ${idx + 1}</span>
              <div class="d-flex gap-2">
                <span class="badge bg-light text-secondary border">Topic: ${q.topic || 'General'}</span>
                ${statusBadge}
              </div>
            </div>

            <h5 class="fw-bold text-dark lh-base mb-3">${q.questionText}</h5>

            <!-- Options Breakdown -->
            <div class="d-flex flex-column gap-2 mb-3">
              ${q.options.map(opt => {
                let cardStyle = 'border: 1px solid #e2e8f0; background: #fff;';
                let icon = '<i class="bi bi-circle text-muted"></i>';
                let tag = '';

                if (opt.isCorrect && opt.isSelected) {
                  cardStyle = 'border: 2px solid #10b981; background: #ecfdf5;';
                  icon = '<i class="bi bi-check-circle-fill text-success fs-5"></i>';
                  tag = '<span class="badge bg-success text-white ms-auto">Your Correct Answer</span>';
                } else if (opt.isCorrect && !opt.isSelected) {
                  cardStyle = 'border: 2px solid #10b981; background: #f0fdf4;';
                  icon = '<i class="bi bi-check-circle text-success fs-5"></i>';
                  tag = '<span class="badge bg-success-subtle text-success border border-success ms-auto">Correct Answer</span>';
                } else if (!opt.isCorrect && opt.isSelected) {
                  cardStyle = 'border: 2px solid #ef4444; background: #fef2f2;';
                  icon = '<i class="bi bi-x-circle-fill text-danger fs-5"></i>';
                  tag = '<span class="badge bg-danger text-white ms-auto">Your Incorrect Choice</span>';
                }

                return `
                  <div class="p-3 rounded d-flex align-items-center gap-3" style="${cardStyle}">
                    ${icon}
                    <span class="fw-medium text-dark">${opt.optionText}</span>
                    ${tag}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Conceptual Explanation -->
            ${q.explanation ? `
              <div class="p-3 rounded bg-light border border-primary border-opacity-25 mt-2">
                <div class="fw-bold text-primary small mb-1">
                  <i class="bi bi-lightbulb-fill text-warning me-1"></i> Conceptual Explanation:
                </div>
                <div class="small text-secondary lh-base">${q.explanation}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
