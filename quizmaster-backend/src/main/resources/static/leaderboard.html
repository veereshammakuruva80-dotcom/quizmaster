<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Leaderboard – QuizMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1 d-flex align-items-center gap-2">
            <i class="bi bi-trophy-fill text-warning"></i> Platform Leaderboard
          </h3>
          <p class="text-secondary small mb-0">Rankings updated automatically after every completed quiz session.</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="card card-custom p-3 mb-4 bg-white shadow-xs">
        <div class="row g-3 align-items-center">
          <div class="col-md-6">
            <div class="btn-group w-100" role="group">
              <button type="button" class="btn btn-outline-custom active" onclick="setPeriod('all_time', this)">All Time</button>
              <button type="button" class="btn btn-outline-custom" onclick="setPeriod('monthly', this)">Monthly</button>
              <button type="button" class="btn btn-outline-custom" onclick="setPeriod('weekly', this)">Weekly</button>
              <button type="button" class="btn btn-outline-custom" onclick="setPeriod('daily', this)">Daily</button>
            </div>
          </div>
          <div class="col-md-6">
            <select id="leaderboard-cat-filter" class="form-select" onchange="loadLeaderboard()">
              <option value="">All Categories</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Leaderboard Table Card -->
      <div class="card card-custom p-4 bg-white">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th style="width: 70px;">Rank</th>
                <th>Learner</th>
                <th>Quizzes</th>
                <th>Average Score</th>
                <th>Highest Score</th>
                <th>Streak</th>
                <th>Total Points</th>
              </tr>
            </thead>
            <tbody id="leaderboard-tbody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted small">Loading leaderboard rankings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentPeriod = 'all_time';

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCategories();
      await loadLeaderboard();
    });

    async function loadCategories() {
      try {
        const categories = await Api.get('/categories');
        const sel = document.getElementById('leaderboard-cat-filter');
        categories.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error('Category load error:', e);
      }
    }

    function setPeriod(p, btn) {
      currentPeriod = p;
      document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadLeaderboard();
    }

    async function loadLeaderboard() {
      const catId = document.getElementById('leaderboard-cat-filter').value;
      const endpoint = `/leaderboard?period=${currentPeriod}${catId ? `&categoryId=${catId}` : ''}`;
      const tbody = document.getElementById('leaderboard-tbody');

      try {
        const entries = await Api.get(endpoint);
        if (!entries || entries.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted small">No participants on the leaderboard yet. Be the first to take a quiz!</td></tr>`;
          return;
        }

        tbody.innerHTML = entries.map(e => {
          let rankBadge = `<span class="fw-bold">${e.rank}</span>`;
          if (e.rank === 1) rankBadge = '<span class="badge rounded-pill bg-warning text-dark px-2 py-1"><i class="bi bi-trophy-fill me-1"></i> #1</span>';
          else if (e.rank === 2) rankBadge = '<span class="badge rounded-pill bg-secondary text-white px-2 py-1"><i class="bi bi-award-fill me-1"></i> #2</span>';
          else if (e.rank === 3) rankBadge = '<span class="badge rounded-pill text-white px-2 py-1" style="background:#b45309;"><i class="bi bi-award me-1"></i> #3</span>';

          const avatar = e.avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(e.fullName || 'User')}&background=random`;

          return `
            <tr>
              <td>${rankBadge}</td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <img src="${avatar}" alt="${e.fullName}" class="rounded-circle" width="32" height="32" style="object-fit: cover;">
                  <span class="fw-semibold text-dark">${e.fullName}</span>
                </div>
              </td>
              <td>${e.totalQuizzes}</td>
              <td><span class="fw-bold text-dark">${e.averageScore}%</span></td>
              <td>${e.highestScore}%</td>
              <td><span class="badge bg-danger-subtle text-danger"><i class="bi bi-fire me-1"></i>${e.streak}d</span></td>
              <td><span class="fw-bold text-primary fs-6">${e.points} pts</span></td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Failed to load leaderboard.</td></tr>`;
      }
    }
  </script>
</body>
</html>
