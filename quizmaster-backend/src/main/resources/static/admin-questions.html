<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Questions – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">Question Bank &amp; Answer Keys</h3>
          <p class="text-secondary small mb-0">Create and curate questions, answer choices, and detailed conceptual explanations.</p>
        </div>
        <button class="btn btn-primary-custom btn-sm" onclick="openQuestionModal()">
          <i class="bi bi-plus-lg me-1"></i> Add Question
        </button>
      </div>

      <!-- Quiz Selection Filter -->
      <div class="card card-custom p-3 mb-4 bg-white shadow-xs">
        <div class="row align-items-center">
          <label class="col-md-3 col-form-label fw-semibold small">Filter by Quiz Assessment:</label>
          <div class="col-md-9">
            <select id="quiz-filter-select" class="form-select" onchange="loadQuestions()"></select>
          </div>
        </div>
      </div>

      <!-- Questions List -->
      <div id="questions-list-container">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
          <div>Loading questions...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Question Modal -->
  <div class="modal fade" id="questionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="question-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="questionModalTitle">Add Question</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="q-id">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label small fw-semibold">Target Quiz *</label>
                <select id="modal-quiz-select" class="form-select" required></select>
              </div>

              <div class="col-md-12">
                <label class="form-label small fw-semibold">Question Text *</label>
                <textarea id="q-text" class="form-control" rows="3" placeholder="Enter problem statement..." required></textarea>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Question Type *</label>
                <select id="q-type" class="form-select">
                  <option value="MCQ" selected>Multiple Choice (Single)</option>
                  <option value="TRUE_FALSE">True / False</option>
                  <option value="MULTIPLE_ANSWER">Multiple Answer (Checkboxes)</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Topic / Tag</label>
                <input type="text" id="q-topic" class="form-control" placeholder="e.g. Normalization">
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Marks *</label>
                <input type="number" id="q-marks" class="form-control" value="5" min="1" max="20" required>
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Answer Choices (Check the box next to correct option) *</label>
                <div class="d-flex flex-column gap-2" id="options-inputs-container">
                  <div class="input-group">
                    <div class="input-group-text">
                      <input class="form-check-input mt-0" type="checkbox" id="opt-correct-1">
                    </div>
                    <input type="text" class="form-control" id="opt-text-1" placeholder="Option 1" required>
                  </div>
                  <div class="input-group">
                    <div class="input-group-text">
                      <input class="form-check-input mt-0" type="checkbox" id="opt-correct-2">
                    </div>
                    <input type="text" class="form-control" id="opt-text-2" placeholder="Option 2" required>
                  </div>
                  <div class="input-group">
                    <div class="input-group-text">
                      <input class="form-check-input mt-0" type="checkbox" id="opt-correct-3">
                    </div>
                    <input type="text" class="form-control" id="opt-text-3" placeholder="Option 3">
                  </div>
                  <div class="input-group">
                    <div class="input-group-text">
                      <input class="form-check-input mt-0" type="checkbox" id="opt-correct-4">
                    </div>
                    <input type="text" class="form-control" id="opt-text-4" placeholder="Option 4">
                  </div>
                </div>
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Conceptual Explanation</label>
                <textarea id="q-explanation" class="form-control" rows="2" placeholder="Explain why the correct answer is valid..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom btn-sm">Save Question</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAdmin();

    let questionModal = null;
    let quizzesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      questionModal = new bootstrap.Modal(document.getElementById('questionModal'));
      await loadQuizzesDropdown();
      await loadQuestions();
    });

    async function loadQuizzesDropdown() {
      try {
        quizzesList = await Api.get('/admin/quizzes');
        const filterSel = document.getElementById('quiz-filter-select');
        const modalSel = document.getElementById('modal-quiz-select');

        const params = new URLSearchParams(window.location.search);
        const urlQuizId = params.get('quizId');

        filterSel.innerHTML = quizzesList.map(q => `
          <option value="${q.id}" ${urlQuizId && urlQuizId == q.id ? 'selected' : ''}>${q.title} (${q.categoryName})</option>
        `).join('');

        modalSel.innerHTML = quizzesList.map(q => `
          <option value="${q.id}">${q.title}</option>
        `).join('');
      } catch (err) {
        console.error('Failed to load quizzes for selector:', err);
      }
    }

    async function loadQuestions() {
      const quizId = document.getElementById('quiz-filter-select').value;
      if (!quizId) return;

      const container = document.getElementById('questions-list-container');
      try {
        const questions = await Api.get(`/admin/questions/quiz/${quizId}`);
        if (!questions || questions.length === 0) {
          container.innerHTML = `
            <div class="card card-custom p-5 text-center text-muted">
              <i class="bi bi-patch-question fs-1 mb-2"></i>
              <h6>No questions found for this quiz.</h6>
              <p class="small">Click "Add Question" to create your first question and answer choices.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = questions.map((q, idx) => `
          <div class="card card-custom p-4 mb-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-light text-dark border">Q${idx + 1} &bull; ${q.marks} Marks</span>
              <div class="d-flex gap-2">
                <span class="badge bg-secondary-subtle text-secondary">${q.topic || 'General'}</span>
                <span class="badge bg-primary-subtle text-primary">${q.questionType}</span>
                <button class="btn btn-sm btn-light border py-0 px-2 text-danger" onclick="deleteQuestion(${q.id})">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <h6 class="fw-bold text-dark lh-base mb-3">${q.questionText}</h6>

            <div class="row g-2 mb-2">
              ${q.options.map(opt => `
                <div class="col-md-6">
                  <div class="p-2 rounded border small d-flex justify-content-between align-items-center ${opt.isCorrect ? 'bg-success-subtle border-success text-success fw-bold' : 'bg-light'}">
                    <span>${opt.optionText}</span>
                    ${opt.isCorrect ? '<i class="bi bi-check-circle-fill"></i>' : ''}
                  </div>
                </div>
              `).join('')}
            </div>

            ${q.explanation ? `
              <div class="p-2 rounded bg-light border text-muted small mt-2">
                <strong>Explanation:</strong> ${q.explanation}
              </div>
            ` : ''}
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div class="card card-custom p-4 text-center text-danger">Failed to load questions.</div>`;
      }
    }

    function openQuestionModal() {
      document.getElementById('q-id').value = '';
      document.getElementById('question-form').reset();
      const currentQuizId = document.getElementById('quiz-filter-select').value;
      if (currentQuizId) {
        document.getElementById('modal-quiz-select').value = currentQuizId;
      }
      document.getElementById('questionModalTitle').textContent = 'Add Question';
      questionModal.show();
    }

    document.getElementById('question-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const quizId = parseInt(document.getElementById('modal-quiz-select').value);
      const questionText = document.getElementById('q-text').value.trim();
      const questionType = document.getElementById('q-type').value;
      const topic = document.getElementById('q-topic').value.trim();
      const marks = parseInt(document.getElementById('q-marks').value);
      const explanation = document.getElementById('q-explanation').value.trim();

      const options = [];
      for (let i = 1; i <= 4; i++) {
        const text = document.getElementById(`opt-text-${i}`).value.trim();
        const isCorrect = document.getElementById(`opt-correct-${i}`).checked;
        if (text) {
          options.push({ optionText: text, isCorrect, sortOrder: i });
        }
      }

      if (options.length < 2) {
        Swal.fire('Error', 'Please provide at least 2 options.', 'warning');
        return;
      }

      const hasCorrect = options.some(o => o.isCorrect);
      if (!hasCorrect) {
        Swal.fire('Error', 'Please mark at least one option as the correct answer.', 'warning');
        return;
      }

      const payload = {
        quizId, questionText, questionType, topic, marks, explanation, options
      };

      try {
        await Api.post('/admin/questions', payload);
        showToast('Question created successfully!', 'success');
        questionModal.hide();
        document.getElementById('quiz-filter-select').value = quizId;
        await loadQuestions();
      } catch (err) {
        Swal.fire('Error', err.message || 'Failed to save question.', 'error');
      }
    });

    async function deleteQuestion(id) {
      const res = await Swal.fire({
        title: 'Delete Question?',
        text: 'Are you sure you want to remove this question?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Yes, delete'
      });

      if (res.isConfirmed) {
        try {
          await Api.del(`/admin/questions/${id}`);
          showToast('Question deleted!', 'success');
          await loadQuestions();
        } catch (err) {
          Swal.fire('Error', err.message || 'Failed to delete question.', 'error');
        }
      }
    }
  </script>
</body>
</html>
