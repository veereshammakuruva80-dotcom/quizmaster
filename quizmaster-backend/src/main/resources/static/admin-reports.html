<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Reports & Attempt Logs – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">Assessment Logs &amp; Audit Reports</h3>
          <p class="text-secondary small mb-0">Platform-wide candidate attempt sessions, scores, and performance verifications.</p>
        </div>
        <button class="btn btn-outline-custom btn-sm" onclick="exportToCsv()">
          <i class="bi bi-download me-1"></i> Export CSV
        </button>
      </div>

      <div class="card card-custom p-4 bg-white">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="reports-table">
            <thead class="table-light small">
              <tr>
                <th>Candidate</th>
                <th>Quiz Assessment</th>
                <th>Category</th>
                <th>Score</th>
                <th>Percentage</th>
                <th>Status</th>
                <th>Performance</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="attempts-tbody">
              <tr>
                <td colspan="8" class="text-center py-4 text-muted small">Loading attempt logs...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAdmin();

    let attemptsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        attemptsData = await Api.get('/admin/attempts');
        renderAttempts(attemptsData);
      } catch (err) {
        document.getElementById('attempts-tbody').innerHTML = `
          <tr><td colspan="8" class="text-center text-danger py-4">Failed to load attempt logs.</td></tr>
        `;
      }
    });

    function renderAttempts(list) {
      const tbody = document.getElementById('attempts-tbody');
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted small">No assessment sessions logged yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(a => {
        const u = a.user || {};
        const q = a.quiz || {};
        const cat = q.category || {};

        return `
          <tr>
            <td>
              <div class="fw-bold text-dark">${u.fullName || 'User'}</div>
              <div class="small text-muted">${u.email || ''}</div>
            </td>
            <td class="fw-semibold">${q.title || 'Quiz'}</td>
            <td><span class="badge bg-light text-dark border">${cat.name || 'Domain'}</span></td>
            <td>${a.score || 0} pts</td>
            <td><strong>${a.percentage || 0}%</strong></td>
            <td>
              ${a.passed ? '<span class="badge bg-success-subtle text-success">Passed</span>' : '<span class="badge bg-danger-subtle text-danger">Failed</span>'}
            </td>
            <td><span class="badge bg-secondary-subtle text-secondary">${a.performanceLevel || 'N/A'}</span></td>
            <td>
              <a href="/api/attempts/${a.id}/report" target="_blank" class="btn btn-sm btn-light border py-1 px-2 text-primary" title="View PDF / HTML Certificate">
                <i class="bi bi-file-earmark-text"></i> Certificate
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function exportToCsv() {
      if (!attemptsData || attemptsData.length === 0) {
        Swal.fire('No Data', 'No records to export.', 'info');
        return;
      }

      let csv = 'ID,Candidate,Email,Quiz,Category,Score,Percentage,Passed,PerformanceLevel\n';
      attemptsData.forEach(a => {
        const u = a.user || {};
        const q = a.quiz || {};
        const cat = q.category || {};
        csv += `"${a.id}","${u.fullName || ''}","${u.email || ''}","${q.title || ''}","${cat.name || ''}",${a.score || 0},${a.percentage || 0},${a.passed || false},"${a.performanceLevel || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('hidden', '');
      a.setAttribute('href', url);
      a.setAttribute('download', 'quizmaster_assessment_logs.csv');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
