<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-navbar"></div>

  <div class="app-container">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">Subject Categories</h3>
          <p class="text-secondary small mb-0">Create, edit, or remove categories from the syllabus.</p>
        </div>
        <button class="btn btn-primary-custom btn-sm" onclick="openCategoryModal()">
          <i class="bi bi-plus-lg me-1"></i> Add Category
        </button>
      </div>

      <div class="card card-custom p-4 bg-white">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small">
              <tr>
                <th>Category</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Color</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categories-tbody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted small">Loading categories...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="category-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="catModalTitle">Add Category</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="cat-id">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Category Name *</label>
              <input type="text" id="cat-name" class="form-control" placeholder="e.g. Cloud Computing" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Slug (Optional)</label>
              <input type="text" id="cat-slug" class="form-control" placeholder="e.g. cloud-computing">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Icon Class (Bootstrap Icons)</label>
              <input type="text" id="cat-icon" class="form-control" placeholder="bi-cloud" value="bi-bookmark">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Theme Color (Hex)</label>
              <input type="color" id="cat-color" class="form-control form-control-color w-100" value="#4f46e5">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Description</label>
              <textarea id="cat-desc" class="form-control" rows="3" placeholder="Brief domain overview..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light border btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-custom btn-sm">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAdmin();

    let catModal = null;

    document.addEventListener('DOMContentLoaded', () => {
      catModal = new bootstrap.Modal(document.getElementById('categoryModal'));
      loadCategories();
    });

    async function loadCategories() {
      try {
        const list = await Api.get('/admin/categories');
        const tbody = document.getElementById('categories-tbody');
        if (!list || list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted small">No categories found.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(c => `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                <span class="stat-icon-wrapper rounded-circle" style="width: 32px; height: 32px; background: ${c.colorCode}20; color: ${c.colorCode}; font-size: 14px;">
                  <i class="bi ${c.icon || 'bi-bookmark'}"></i>
                </span>
                <span class="fw-bold text-dark">${c.name}</span>
              </div>
            </td>
            <td><code class="small">${c.slug}</code></td>
            <td class="small text-muted" style="max-width: 250px;">${c.description || 'N/A'}</td>
            <td>
              <span class="badge" style="background: ${c.colorCode}; color: #fff;">${c.colorCode}</span>
            </td>
            <td>
              <div class="d-flex gap-1">
                <button class="btn btn-sm btn-light border py-1 px-2 text-primary" onclick='editCategory(${JSON.stringify(c)})'>
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-light border py-1 px-2 text-danger" onclick="deleteCategory(${c.id})">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('categories-tbody').innerHTML = `
          <tr><td colspan="5" class="text-center text-danger py-4">Failed to load categories.</td></tr>
        `;
      }
    }

    function openCategoryModal() {
      document.getElementById('cat-id').value = '';
      document.getElementById('category-form').reset();
      document.getElementById('cat-color').value = '#4f46e5';
      document.getElementById('catModalTitle').textContent = 'Add Category';
      catModal.show();
    }

    function editCategory(c) {
      document.getElementById('cat-id').value = c.id;
      document.getElementById('cat-name').value = c.name;
      document.getElementById('cat-slug').value = c.slug;
      document.getElementById('cat-icon').value = c.icon || 'bi-bookmark';
      document.getElementById('cat-color').value = c.colorCode || '#4f46e5';
      document.getElementById('cat-desc').value = c.description || '';
      document.getElementById('catModalTitle').textContent = 'Edit Category';
      catModal.show();
    }

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('cat-id').value;
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim();
      const icon = document.getElementById('cat-icon').value.trim();
      const colorCode = document.getElementById('cat-color').value;
      const description = document.getElementById('cat-desc').value.trim();

      const payload = { name, slug, icon, colorCode, description };

      try {
        if (id) {
          await Api.put(`/admin/categories/${id}`, payload);
          showToast('Category updated successfully!', 'success');
        } else {
          await Api.post('/admin/categories', payload);
          showToast('Category created successfully!', 'success');
        }
        catModal.hide();
        await loadCategories();
      } catch (err) {
        Swal.fire('Error', err.message || 'Failed to save category.', 'error');
      }
    });

    async function deleteCategory(id) {
      const res = await Swal.fire({
        title: 'Delete Category?',
        text: 'This will also delete associated quizzes and questions!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Yes, delete it'
      });

      if (res.isConfirmed) {
        try {
          await Api.del(`/admin/categories/${id}`);
          showToast('Category deleted successfully!', 'success');
          await loadCategories();
        } catch (err) {
          Swal.fire('Error', err.message || 'Failed to delete category.', 'error');
        }
      }
    }
  </script>
</body>
</html>
